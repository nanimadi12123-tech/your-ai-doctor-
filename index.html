<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TenaCare AI - Security & Payment Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="h-full flex items-center justify-center p-4 text-slate-100">

    <!-- Admin Lock Screen -->
    <div id="authScreen" class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-2xl text-center space-y-4">
        <div class="w-16 h-16 rounded-2xl bg-teal-600/20 border border-teal-500/40 text-teal-400 mx-auto flex items-center justify-center text-2xl shadow-inner">
            <i class="fa-solid fa-user-shield"></i>
        </div>
        <div>
            <h1 class="text-xl font-black text-white">TenaCare Admin Portal</h1>
            <p class="text-xs text-slate-400 mt-1">Restricted Access. Enter Admin PIN to review pending Telebirr transfers.</p>
        </div>
        <form onsubmit="unlockAdmin(event)" class="space-y-3">
            <input type="password" id="adminPin" placeholder="Enter Security PIN (Default: 9999)" required class="w-full text-center bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-lg font-mono font-bold tracking-widest text-teal-400 focus:outline-none focus:ring-2 focus:ring-teal-500">
            <button type="submit" class="w-full py-3 bg-teal-600 hover:bg-teal-500 text-white font-extrabold rounded-xl text-sm transition-all shadow-md">
                Authenticate & Unlock
            </button>
        </form>
    </div>

    <!-- Protected Admin Dashboard -->
    <div id="dashboardScreen" class="hidden max-w-4xl w-full bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-2xl space-y-6">
        <div class="flex items-center justify-between border-b border-slate-700 pb-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-teal-500/20 text-teal-400 flex items-center justify-center font-black">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div>
                    <h2 class="text-lg font-bold text-white">Pending Telebirr Approvals</h2>
                    <p class="text-xs text-slate-400">Receiver Telebirr Account: <span class="font-mono text-teal-400 font-bold">0982310337</span></p>
                </div>
            </div>
            <button onclick="lockAdmin()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold rounded-xl text-xs transition-colors">
                <i class="fa-solid fa-lock mr-1"></i> Lock Portal
            </button>
        </div>

        <div id="transfersList" class="space-y-3 text-xs">
            <!-- Rendered by JS -->
        </div>
    </div>

    <script>
        const ADMIN_PIN = "9999"; // Change this to your secure passcode

        function unlockAdmin(e) {
            e.preventDefault();
            const input = document.getElementById('adminPin').value;
            if (input === ADMIN_PIN) {
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('dashboardScreen').classList.remove('hidden');
                renderTransfers();
            } else {
                alert("Incorrect Admin Security PIN.");
            }
        }

        function lockAdmin() {
            document.getElementById('adminPin').value = '';
            document.getElementById('dashboardScreen').classList.add('hidden');
            document.getElementById('authScreen').classList.remove('hidden');
        }

        function getPendingPayments() {
            return JSON.parse(localStorage.getItem('tena_pending_payments') || '[]');
        }

        function renderTransfers() {
            const list = getPendingPayments();
            const container = document.getElementById('transfersList');
            
            if (list.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-slate-500 bg-slate-900/50 rounded-2xl border border-slate-700/50">No pending account registration transfers found.</div>`;
                return;
            }

            container.innerHTML = list.map(item => `
                <div class="bg-slate-900 border border-slate-700 p-4 rounded-2xl flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                    <div class="space-y-1">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-sm text-white">${item.senderName}</span>
                            <span class="px-2 py-0.5 rounded text-[10px] font-extrabold ${item.status === 'Approved' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}">${item.status}</span>
                        </div>
                        <p class="text-slate-400">Phone: <code class="text-teal-400 font-mono">${item.senderPhone}</code> | Plan: <strong class="text-white">${item.amount} ETB</strong></p>
                        <p class="text-slate-400">Telebirr Ref: <code class="bg-slate-800 text-slate-200 px-2 py-0.5 rounded font-mono">${item.txnRef}</code></p>
                        <p class="text-[10px] text-slate-500">${item.timestamp}</p>
                        ${item.receiptData ? `<img src="${item.receiptData}" class="w-32 h-20 object-cover rounded-lg border border-slate-700 mt-2">` : ''}
                    </div>
                    <div class="flex flex-col items-end gap-2 w-full md:w-auto">
                        <span class="text-[11px] font-mono text-slate-400">Activation Code: <strong class="text-teal-400 font-bold">${item.activationCode}</strong></span>
                        ${item.status === 'Pending' ? `
                            <button onclick="approveRecord('${item.id}')" class="w-full md:w-auto px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold rounded-xl text-xs transition-colors shadow">
                                Approve & Issue Code
                            </button>
                        ` : `<span class="text-emerald-400 font-bold text-xs"><i class="fa-solid fa-circle-check"></i> Approved</span>`}
                    </div>
                </div>
            `).join('');
        }

        function approveRecord(id) {
            const list = getPendingPayments();
            const item = list.find(p => p.id === id);
            if (item) {
                item.status = 'Approved';
                localStorage.setItem('tena_pending_payments', JSON.stringify(list));
                renderTransfers();
            }
        }
    </script>
</body>
</html>
